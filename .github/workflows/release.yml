name: Release

# Merging dev into main builds the image once, pushes it to ACR as
# jevtrader:<12-char-sha> and records that tag on the VM as jev-image=<sha>.
# The VM pulls the tagged image when it boots, so a merge never disturbs a live
# session. Rollback: run this workflow by hand with rollback_sha set to an
# earlier tag. See deploy/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Re-point the VM at an image already in ACR (12-char sha). Skips the build."
        required: false
        type: string

# Never cancel a release halfway: the VM tag must end up matching a pushed image.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  configure:
    name: Check Azure configuration
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          VM_NAME: ${{ vars.VM_NAME }}
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          missing=""
          for v in TENANT SUBSCRIPTION RESOURCE_GROUP VM_NAME ACR_NAME; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release skipped::Azure is not configured yet (unset repository variables:$missing). See deploy/README.md."
            echo "Release skipped: Azure is not configured yet (unset:$missing). See deploy/README.md." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build, push and tag
    needs: configure
    if: needs.configure.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      VM_RESOURCE_ID: /subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.RESOURCE_GROUP }}/providers/Microsoft.Compute/virtualMachines/${{ vars.VM_NAME }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image tag
        id: tag
        run: |
          if [ -n "$ROLLBACK_SHA" ]; then
            if ! printf '%s' "$ROLLBACK_SHA" | grep -Eq '^[0-9a-f]{12}$'; then
              echo "::error::rollback_sha must be 12 lowercase hex characters"
              exit 1
            fi
            sha="$ROLLBACK_SHA"
          else
            sha="${GITHUB_SHA::12}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        if: env.ROLLBACK_SHA == ''
        uses: docker/setup-buildx-action@v3

      # One build, one immutable sha tag. The moving "main" tag is only a
      # convenience for humans; the VM never reads it and "latest" is never used.
      - name: Build and push
        if: env.ROLLBACK_SHA == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.tag.outputs.sha }}
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/jevtrader:${{ steps.tag.outputs.sha }}
            ${{ vars.ACR_NAME }}.azurecr.io/jevtrader:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image exists in ACR
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: docker buildx imagetools inspect "$ACR_NAME.azurecr.io/jevtrader:$SHA" > /dev/null

      # The only deploy action: tell the VM which image to pull at its next boot.
      - name: Set the VM tag jev-image
        env:
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          az tag update --resource-id "$VM_RESOURCE_ID" --operation Merge --tags "jev-image=$SHA" --output none
          got=$(az tag list --resource-id "$VM_RESOURCE_ID" --query 'properties.tags."jev-image"' --output tsv)
          [ "$got" = "$SHA" ] || { echo "::error::VM tag jev-image is '$got', expected '$SHA'"; exit 1; }
          echo "Image jevtrader:$SHA is now the VM's boot image (applies at its next start)." | tee -a "$GITHUB_STEP_SUMMARY"
